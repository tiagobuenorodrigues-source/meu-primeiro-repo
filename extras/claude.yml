# Workflow do GitHub Actions que chama o Claude quando alguém escreve @claude
# em uma issue, em um comentário ou em uma revisão de pull request.
#
# Como ativar (etapa 8 da apostila):
#   1. Instale o app do Claude no repositório: https://github.com/apps/claude
#   2. Crie o segredo ANTHROPIC_API_KEY em Settings > Secrets and variables > Actions
#   3. Mova este arquivo para .github/workflows/claude.yml, faça commit e push

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Só roda quando o texto contém @claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # criar branches e commits
      pull-requests: write   # abrir e comentar pull requests
      issues: write          # responder nas issues
      id-token: write
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Chamar o Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
